# This workflow runs comprehensive tests on pull requests and pushes to main/develop branches
# Ensures code quality and prevents regressions before merging

name: Test Pull Request

on:
  pull_request:
    branches:
      - main      # Run tests on PRs targeting main branch
      - develop   # Run tests on PRs targeting develop branch
  push:
    branches:
      - main      # Run tests on direct pushes to main
      - develop   # Run tests on direct pushes to develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci  # Clean install to ensure reproducible builds

      - name: Run all tests
        # Runs: unit tests (Jest), integration tests, heading styles examples, and TypeScript tests
        run: npm run test:all

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Fails on any violation the baseline counts do not cover and, on a pull request, on a
        # baseline that grew compared to the base branch. A PR that turns on a new rule and
        # baselines its violations opts in with the lint-baseline-growth label.
        env:
          BASE_REF: ${{ github.base_ref }}
          ALLOW_BASELINE_GROWTH: ${{ contains(github.event.pull_request.labels.*.name, 'lint-baseline-growth') }}
        run: |
          base_args=""
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            base_args="--base FETCH_HEAD"
          fi
          if [ "$ALLOW_BASELINE_GROWTH" = "true" ]; then base_args="$base_args --allow-base-growth"; fi
          npm run -s lint:ci -- $base_args

      - name: Check formatting
        # Runs even when lint fails, so one CI run reports both.
        if: success() || failure()
        run: npm run prettier:check
