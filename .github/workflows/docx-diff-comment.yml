# Posts the DOCX diff report produced by docx-diff.yml as a PR comment.
#
# SECURITY: this runs on `workflow_run` in the TRUSTED base-repo context. It holds
# `pull-requests: write` but NEVER checks out PR code — it only downloads the report
# artifact from the triggering run and posts a comment. Keep it that way: do not add
# a repo/PR-code checkout or run any PR-authored code here.
#
# The target PR is resolved TRUSTED-SIDE from the build run's head SHA — never from
# the artifact, which the untrusted build could tamper with to redirect the comment
# at an arbitrary PR. Only the comment *body* (the diff of the PR's own code) comes
# from the artifact, and it lands solely on that PR — bounded, not a redirect vector.

name: TurboDocx DOCX Diff Comment

on:
  workflow_run:
    workflows: ["TurboDocx DOCX Diff Report"]
    types:
      - completed

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    # Only for PR-triggered runs (skip if someone runs the build on a branch push).
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download diff report artifact from the build run
        uses: actions/download-artifact@v5
        with:
          name: turbodocx-docx-diff-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: report

      - name: Post / update the PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            let report;
            try {
              report = fs.readFileSync('report/diff-report.md', 'utf8');
            } catch (e) {
              core.info('No diff-report.md in the artifact (diff step likely errored before writing) — nothing to comment.');
              return;
            }

            // Resolve the target PR trusted-side from the build run's head commit,
            // NOT from the artifact (which the untrusted build could have spoofed).
            const headSha = context.payload.workflow_run.head_sha;
            const assoc = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha,
            });
            const pr = assoc.data.find(p => p.state === 'open') || assoc.data[0];
            if (!pr) {
              core.info(`No PR associated with ${headSha} — nothing to comment.`);
              return;
            }
            const prNumber = pr.number;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('TurboDocx DOCX Diff Report')
            );

            const commentBody = `${report}\n\n---\n\n### 🚀 Powered by [TurboDocx](https://turbodocx.com) | [html-to-docx](https://github.com/TurboDocx/html-to-docx)\n**Automated DOCX regression testing** • Catch document generation bugs before they ship • 100% open source\n\n*Generated by TurboDocx DOCX Diff workflow*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }
