# TurboDocx DOCX Diff - Automated regression testing for HTML to DOCX conversion
# Compares DOCX output between the base branch and the PR to catch regressions.
#
# SECURITY: this workflow builds and runs UNTRUSTED PR code (npm ci + npm test),
# so it runs under `pull_request` with a read-only token and NO secrets. It never
# posts to the PR itself — it uploads the report as an artifact, and the separate
# `docx-diff-comment.yml` workflow (workflow_run, trusted base context, no PR
# checkout) posts the comment. This is the standard safe pattern for commenting on
# fork PRs; do not add a write token here or move the comment step back in.

name: TurboDocx DOCX Diff Report

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  docx-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Setup Node.js for baseline
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: baseline/package-lock.json

      - name: Install dependencies (baseline)
        working-directory: baseline
        run: npm ci

      - name: Generate baseline DOCX (HTML to DOCX conversion test)
        working-directory: baseline
        env:
          DETERMINISTIC_IDS: 'true'
        run: |
          npm test
          mv example-node.docx ../baseline.docx

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          # `pull_request` checks out the PR merge ref by default (PR code merged
          # into the base), so this tests the actual PR changes. The token here is
          # read-only and no secrets are present, so running this untrusted code
          # is safe. `persist-credentials: false` keeps even that token out of the
          # checked-out .git/config.
          persist-credentials: false
          path: current

      - name: Setup Node.js for current
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: current/package-lock.json

      - name: Install dependencies (current)
        working-directory: current
        run: npm ci

      - name: Generate current DOCX (HTML to DOCX conversion test)
        working-directory: current
        env:
          DETERMINISTIC_IDS: 'true'
        run: |
          npm test
          mv example-node.docx ../current.docx

      - name: Run TurboDocx DOCX diff analysis
        id: diff
        # Run from the workspace root so the report path stays inside cwd (the
        # script rejects an --output outside process.cwd()).
        run: |
          node current/scripts/diff-docx.js baseline.docx current.docx --output diff-report.md || echo "diff_failed=true" >> $GITHUB_OUTPUT

      - name: Upload TurboDocx DOCX diff report as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: turbodocx-docx-diff-report
          path: |
            baseline.docx
            current.docx
            diff-report.md
          retention-days: 30
          if-no-files-found: warn

      - name: Verify DOCX regression test results
        if: steps.diff.outputs.diff_failed == 'true'
        run: |
          echo "::error::DOCX diff detected unexpected changes. Please review the diff report."
          exit 1
